name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build
          git diff --exit-code -- lib
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  solar_core:
    name: solar_core (maths) tests, 95% coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/solar_core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart format --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos
      - run: dart run coverage:test_with_coverage
      - name: Enforce 95% line coverage
        run: |
          LF=$(grep -h '^LF:' coverage/lcov.info | cut -d: -f2 | paste -sd+ | bc)
          LH=$(grep -h '^LH:' coverage/lcov.info | cut -d: -f2 | paste -sd+ | bc)
          echo "Coverage: $LH / $LF"
          test $((LH * 100 / LF)) -ge 95

  functions:
    name: Edge Function tests (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test tests/
      - run: deno check */index.ts

  pdf_service:
    name: PDF service (template + signing tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - run: npm test

  database:
    name: Database (RLS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db

  android:
    name: Build APK
    needs: flutter
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Write build config
        env:
          APP_ENV_JSON: ${{ secrets.APP_ENV_JSON }}
        run: |
          if [ -z "$APP_ENV_JSON" ]; then cp env/dev.example.json env/build.json; else echo "$APP_ENV_JSON" > env/build.json; fi
      - run: flutter pub get
      - run: flutter build apk --release --dart-define-from-file=env/build.json
      - uses: actions/upload-artifact@v4
        with:
          name: solarkatha-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
