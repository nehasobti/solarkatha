include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
    - lib/**/*.g.dart
    - lib/**/*.freezed.dart
    - lib/l10n/gen/**
  errors:
    # PowerSync's attachment queue (photo upload queue) is marked
    # experimental upstream; we use it deliberately (see DECISIONS.md).
    experimental_member_use: ignore
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
