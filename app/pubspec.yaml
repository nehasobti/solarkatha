name: solarkatha
description: "SolarKatha – rooftop solar sales, survey and PM Surya Ghar subsidy tracking for installers."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.0
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  powersync: ^1.18.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  powersync_core: ^1.8.0
  logging: ^1.3.0
  path: ^1.9.1
  fl_chart: ^1.2.0
  solar_core:
    path: ../packages/solar_core
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
